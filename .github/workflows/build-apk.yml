name: Build and Release arm64-v8a APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload arm64-v8a Compatible Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeyOD-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "HeyOD arm64-v8a Build v1.0.0"
          body: "Automated arm64-v8a build of HeyOD."
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
